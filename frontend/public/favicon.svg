<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Emblem Background -->
  <rect width="32" height="32" rx="7.5" fill="url(#bgGrad)"/>
  <rect width="31" height="31" x="0.5" y="0.5" rx="7" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="0.8"/>

  <!-- Scales of Justice Symbol -->
  <g filter="url(#glow)">
    <!-- Central Pillar & Base -->
    <path d="M16 6.8v15.7M11.5 24h9" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
    
    <!-- Top Finial Orb -->
    <circle cx="16" cy="6" r="1.3" fill="#FFFFFF"/>

    <!-- Balance Crossbeam -->
    <path d="M8.5 10.2h15" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Left Balance Strings & Pan -->
    <path d="M8.5 10.2L6 14.8h5L8.5 10.2z" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M5.5 14.8c0 1.6 1.34 2.7 3 2.7s3-1.1 3-2.7H5.5z" fill="#FFFFFF"/>

    <!-- Right Balance Strings & Pan -->
    <path d="M23.5 10.2l-2.5 4.6h5l-2.5-4.6z" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M20.5 14.8c0 1.6 1.34 2.7 3 2.7s3-1.1 3-2.7h-6z" fill="#FFFFFF"/>

    <!-- AI Intelligence Spark Accent -->
    <path d="M24.5 4.8l.4.9.9.4-.9.4-.4.9-.4-.9-.9-.4.9-.4z" fill="#FDE047"/>
  </g>
</svg>