<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pakistan Legal Rights Agent — An AI-powered legal information assistant for Pakistan. Verified, evidence-backed guidance on tenancy, labor, and civil rights." />
    <meta name="theme-color" content="#0b192c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Pakistan Legal Rights Agent — Pakistan Legal Intelligence</title>
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('legalai_theme');
          const isLight = stored === 'light' || (!stored && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (isLight) {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#0A051B] text-slate-900 dark:text-slate-100 font-sans antialiased min-h-screen selection:bg-purple-500/30 selection:text-purple-200 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
